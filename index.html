<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Key Xác Minh Minecraft</title>
<style>
  :root{
    --bg: #0a0e12;
    --panel: #10161c;
    --panel-2: #151d24;
    --line: #23303a;
    --amber: #ffb84d;
    --amber-dim: #a06b1f;
    --green: #6fe08a;
    --red: #ff6b6b;
    --text: #d7e0e6;
    --text-dim: #7c8b95;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html{
    background: var(--bg);
  }
  body{
    margin:0; padding:0; min-height:100vh;
    color: var(--text);
    font-family: var(--mono);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    overflow-x:hidden;
  }

  /* ---- Nền: ảnh nền (đổi link tại đây) + overlay tối + starfield ---- */
  #bg-image{
    position: fixed;
    inset: 0;
    z-index: -3;
    background-image: url('https://res.cloudinary.com/dkui88bcf/image/upload/v1786093084/ThoBayMau_txlygo.jpg');
    background-size: contain;
    background-position: center top;
    background-repeat: no-repeat;
    filter: blur(4px) brightness(0.65) saturate(0.95);
  }
  #bg-canvas{
    position: fixed;
    inset: 0;
    z-index: -2;
    display:block;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    z-index: -1;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,184,77,0.08), transparent 55%),
      radial-gradient(circle at 15% 85%, rgba(111,224,138,0.05), transparent 50%),
      radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: auto, auto, 22px 22px;
    pointer-events:none;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    z-index: -1;
    background: radial-gradient(circle at 50% 45%, rgba(10,14,18,0.25) 0%, rgba(10,14,18,0.55) 55%, rgba(10,14,18,0.75) 100%);
    pointer-events:none;
  }

  .console{
    position:relative;
    width:100%; max-width:560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(255,184,77,0.04), 0 20px 60px rgba(0,0,0,0.6);
  }
  .titlebar{
    display:flex; align-items:center; justify-content:flex-end;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    border-radius: 4px 4px 0 0;
  }
  .titlebar .label{
    font-size: 12px; letter-spacing: 2px; color: var(--text-dim);
    text-transform: uppercase;
  }
  .dots{ display:flex; gap:6px; }
  .dots span{ width:8px; height:8px; border-radius:50%; background:#2a3640; }

  .body{ padding: 28px 26px 26px; border-radius: 4px; }

  .hdr{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom: 22px;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 16px;
  }
  .hdr h1{
    font-size: 18px; margin:0; letter-spacing: 1px; color: var(--text);
    font-weight: 600;
  }
  .hdr h1 span{ color: var(--amber); }
  .hdr .stamp{ font-size: 11px; color: var(--text-dim); margin-right: auto; }
  .status-inline{
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; white-space: nowrap;
  }

  .pulse{
    width:8px; height:8px; border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 0 0 rgba(255,184,77,0.6);
    animation: pulse 1.6s infinite;
    flex-shrink:0;
  }
  .pulse.ready{ background: var(--green); animation:none; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(255,184,77,0.5); }
    70%{ box-shadow: 0 0 0 8px rgba(255,184,77,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,184,77,0); }
  }

  .ad-bay{
    background: repeating-linear-gradient(135deg, #0d1319, #0d1319 10px, #101820 10px, #101820 20px);
    border: 1px dashed var(--line);
    border-radius: 3px;
    min-height: 140px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim);
    font-size: 11px; letter-spacing: 1px; text-transform:uppercase;
    margin-bottom: 20px;
    text-align:center;
    padding: 12px;
  }
  /* Dán code quảng cáo (AdSense / banner) của bạn vào bên trong #ad-slot bên dưới HTML */

  .progress-wrap{
    margin-bottom: 20px;
  }
  .progress-track{
    height: 6px; width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    transition: width 0.2s linear;
  }
  .progress-labels{
    display:flex; justify-content:space-between;
    font-size: 11px; color: var(--text-dim);
    margin-top: 8px;
  }

  button.main-btn{
    width:100%;
    padding: 14px;
    font-family: var(--mono);
    font-size: 13px; letter-spacing: 2px; text-transform:uppercase;
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: not-allowed;
    transition: all 0.25s ease;
  }
  button.main-btn.ready{
    color: #0a0e12;
    background: var(--green);
    border-color: var(--green);
    cursor: pointer;
    box-shadow: 0 0 24px rgba(111,224,138,0.25);
  }
  button.main-btn.ready:hover{ filter: brightness(1.08); }

  .key-out{
    display:none;
    margin-top: 20px;
    padding: 16px;
    background: var(--panel-2);
    border: 1px solid var(--green);
    border-radius: 3px;
  }
  .key-out.show{ display:block; }
  .key-out .k-label{
    font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
    margin-bottom: 8px; text-transform:uppercase;
  }
  .key-row{
    display:flex; gap:8px;
  }
  .key-row input{
    flex:1;
    font-family: var(--mono);
    font-size: 16px; letter-spacing: 2px;
    background: var(--bg);
    color: var(--green);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
  }
  .key-row button{
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 1px; text-transform:uppercase;
    background: transparent;
    color: var(--amber);
    border: 1px solid var(--amber-dim);
    border-radius: 3px;
    padding: 0 16px;
    cursor:pointer;
  }
  .key-row button:hover{ background: rgba(255,184,77,0.08); }

  .footnote{
    margin-top: 18px;
    font-size: 10.5px; color: var(--text-dim); text-align:center;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <div id="bg-image"></div>
  <canvas id="bg-canvas"></canvas>

  <div class="console">
    <div class="body">
      <div class="hdr">
        <h1>GET<span>KEY</span></h1>
        <span class="stamp" id="stamp"></span>
        <div class="pulse" id="pulse"></div>
        <span class="status-inline" id="statusText">ĐANG XÁC MINH</span>
      </div>

      <!-- Khu vực quảng cáo: dán code AdSense/banner của bạn vào #ad-slot -->
      <div class="ad-bay" id="ad-slot">
        [ KHU VỰC QUẢNG CÁO — dán mã AdSense / banner vào đây ]
      </div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-labels">
          <span>0s</span>
          <span id="countdownLabel">20s</span>
        </div>
      </div>

      <button class="main-btn" id="mainBtn" disabled>ĐANG CHỜ...</button>

      <div class="key-out" id="keyOut">
        <div class="k-label">KEY</div>
        <div class="key-row">
          <input type="text" id="keyValue" readonly>
          <button id="copyBtn">COPY</button>
        </div>
      </div>

      <div class="footnote">Vui Lòng Không Rời Trang Này. Key Đang Được Tạo</div>
    </div>
  </div>

<script>
  // ---- Nền starfield chuyển động nhẹ ----
  (function(){
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let w, h;

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      const count = Math.floor((w * h) / 9000);
      stars = Array.from({length: count}, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.2 + 0.2,
        speed: Math.random() * 0.15 + 0.03,
        tw: Math.random() * Math.PI * 2
      }));
    }

    function draw(){
      ctx.clearRect(0, 0, w, h);
      for (const s of stars){
        s.tw += 0.02;
        const alpha = 0.35 + Math.sin(s.tw) * 0.35;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(215, 224, 230, ${Math.max(0, alpha)})`;
        ctx.fill();

        s.y += s.speed;
        if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  })();

  const TOTAL_SECONDS = 20; // đổi thời gian đếm ngược tại đây
  let elapsed = 0;

  const pulse = document.getElementById('pulse');
  const statusText = document.getElementById('statusText');
  const progressFill = document.getElementById('progressFill');
  const countdownLabel = document.getElementById('countdownLabel');
  const mainBtn = document.getElementById('mainBtn');
  const keyOut = document.getElementById('keyOut');
  const keyValue = document.getElementById('keyValue');
  const copyBtn = document.getElementById('copyBtn');
  const stamp = document.getElementById('stamp');

  stamp.textContent = new Date().toLocaleString('vi-VN');

  const timer = setInterval(() => {
    elapsed++;
    const remain = TOTAL_SECONDS - elapsed;
    const pct = Math.min(100, (elapsed / TOTAL_SECONDS) * 100);
    progressFill.style.width = pct + '%';
    countdownLabel.textContent = Math.max(0, remain) + 's';

    if (elapsed >= TOTAL_SECONDS) {
      clearInterval(timer);
      pulse.classList.add('ready');
      statusText.textContent = 'SẴN SÀNG';
      mainBtn.disabled = false;
      mainBtn.textContent = 'NHẬN KEY';
      mainBtn.classList.add('ready');
    }
  }, 1000);

  function generateKey(){
    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const digits = '0123456789';
    const part = (charset, len) => Array.from({length:len}, () => charset[Math.floor(Math.random()*charset.length)]).join('');
    return `FREE-${part(letters,4)}-${part(digits,4)}`;
  }

  // Link quảng cáo mở song song khi bấm nút — không bắt buộc, key vẫn cấp ngay dù có mở được tab hay không
  const AD_LINK = 'https://vidu-quangcao.com';

  mainBtn.addEventListener('click', () => {
    if (!mainBtn.classList.contains('ready')) return;

    if (AD_LINK) {
      window.open(AD_LINK, '_blank', 'noopener,noreferrer');
    }

    keyValue.value = generateKey();
    keyOut.classList.add('show');
    mainBtn.disabled = true;
    mainBtn.textContent = 'ĐÃ CẤP KEY';
    statusText.textContent = 'HOÀN TẤT';
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(keyValue.value);
      copyBtn.textContent = 'ĐÃ COPY';
      setTimeout(() => copyBtn.textContent = 'COPY', 1500);
    } catch(e) {
      keyValue.select();
      document.execCommand('copy');
    }
  });
</script>

</body>
</html>
