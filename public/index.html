<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Get Key Minecraft</title>

    <style>

        :root {
            --bg: #0a0e12;
            --panel: rgba(14, 20, 25, 0.94);
            --panel-2: rgba(18, 25, 31, 0.96);
            --line: #29343d;

            --text: #e6edf3;
            --text-dim: #7d8993;

            --amber: #ffb84d;
            --amber-dim: #a8752e;

            --green: #6fe08a;

            --purple: #8b6cf7;
            --purple-2: #6c4ce0;
            --purple-glow: rgba(139,108,247,0.35);

            --mono:
                Consolas,
                "Courier New",
                monospace;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: var(--bg);

            color: var(--text);

            font-family: var(--mono);

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND
        ========================= */

        #bg-image {
            position: fixed;
            inset: 0;

            z-index: -3;

            background-image:
                url("https://res.cloudinary.com/dkui88bcf/image/upload/v1786093084/ThoBayMau_txlygo.jpg");

            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;

            filter:
                blur(4px)
                brightness(0.65)
                saturate(0.95);

            transform: scale(1.04);
        }


        #bg-canvas {
            position: fixed;
            inset: 0;

            z-index: -2;

            display: block;
        }


        body::before {
            content: "";

            position: fixed;
            inset: 0;

            z-index: -1;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(255,184,77,0.08),
                    transparent 55%
                ),

                radial-gradient(
                    circle at 15% 85%,
                    rgba(111,224,138,0.05),
                    transparent 50%
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px
                );

            background-size:
                auto,
                auto,
                22px 22px;

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;
            inset: 0;

            z-index: -1;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(10,14,18,0.25) 0%,
                    rgba(10,14,18,0.55) 55%,
                    rgba(10,14,18,0.75) 100%
                );

            pointer-events: none;
        }


        /* =========================
           CONSOLE
        ========================= */

        .console {
            position: relative;

            width: 100%;
            max-width: 560px;

            background: var(--panel);

            border: 1px solid var(--line);

            border-radius: 22px;

            box-shadow:
                0 0 0 1px rgba(139,108,247,0.08),
                0 20px 60px rgba(0,0,0,0.6);

            backdrop-filter: blur(8px);
        }


        /* =========================
           BODY
        ========================= */

        .body {
            padding:
                28px 26px 26px;

            border-radius: 4px;
        }


        /* =========================
           HEADER
        ========================= */

        .hdr {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 22px;

            border-bottom:
                1px dashed var(--line);

            padding-bottom: 16px;
        }


        .hdr h1 {
            font-size: 18px;

            margin: 0;

            letter-spacing: 1px;

            color: var(--text);

            font-weight: 600;
        }


        .hdr h1 span {
            color: var(--amber);
        }


        .hdr .stamp {
            font-size: 11px;

            color: var(--text-dim);

            margin-right: auto;
        }


        .status-inline {
            font-size: 11px;

            color: var(--text-dim);

            letter-spacing: 0.5px;

            white-space: nowrap;
        }


        .pulse {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                var(--amber);

            box-shadow:
                0 0 0 0 rgba(255,184,77,0.6);

            animation:
                pulse 1.6s infinite;

            flex-shrink: 0;
        }


        .pulse.ready {
            background:
                var(--green);

            animation: none;
        }


        @keyframes pulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(255,184,77,0.5);
            }

            70% {
                box-shadow:
                    0 0 0 8px
                    rgba(255,184,77,0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(255,184,77,0);
            }

        }


        /* =========================
           PROGRESS
        ========================= */

        .progress-wrap {
            margin-bottom: 20px;
        }


        .progress-track {
            height: 6px;

            width: 100%;

            background:
                var(--panel-2);

            border:
                1px solid var(--line);

            border-radius: 6px;

            overflow: hidden;
        }


        .progress-fill {
            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    var(--amber-dim),
                    var(--amber)
                );

            transition:
                width 0.2s linear;
        }


        .progress-labels {
            display: flex;

            justify-content: space-between;

            font-size: 11px;

            color: var(--text-dim);

            margin-top: 8px;
        }


        /* =========================
           BUTTON
        ========================= */

        button.main-btn {
            width: 100%;

            padding: 14px;

            font-family: var(--mono);

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;

            background:
                var(--panel-2);

            color:
                var(--text-dim);

            border:
                1px solid var(--line);

            border-radius: 14px;

            cursor: not-allowed;

            transition:
                all 0.25s ease;
        }


        button.main-btn.ready {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple-2)
                );

            border-color:
                var(--purple-2);

            cursor: pointer;

            box-shadow:
                0 0 24px
                var(--purple-glow);
        }


        button.main-btn.ready:hover {
            filter:
                brightness(1.08);
        }


        /* =========================
           KEY OUTPUT
        ========================= */

        .key-out {
            display: none;

            margin-top: 20px;

            padding: 16px;

            background:
                var(--panel-2);

            border:
                1px solid var(--purple);

            border-radius: 16px;
        }


        .key-out.show {
            display: block;
        }


        .key-out .k-label {
            font-size: 11px;

            color:
                var(--text-dim);

            letter-spacing: 1px;

            margin-bottom: 8px;

            text-transform: uppercase;
        }


        .key-row {
            display: flex;

            gap: 8px;
        }


        .key-row input {
            flex: 1;

            min-width: 0;

            font-family: var(--mono);

            font-size: 16px;

            letter-spacing: 2px;

            background:
                var(--bg);

            color:
                var(--purple);

            border:
                1px solid var(--line);

            border-radius: 10px;

            padding:
                10px 12px;
        }


        .key-row button {
            font-family: var(--mono);

            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple-2)
                );

            color:
                #ffffff;

            border:
                1px solid var(--purple-2);

            border-radius: 10px;

            padding:
                0 16px;

            cursor: pointer;

            box-shadow:
                0 0 16px
                var(--purple-glow);
        }


        .key-row button:hover {
            filter:
                brightness(1.1);
        }


        /* =========================
           FOOTNOTE
        ========================= */

        .footnote {
            margin-top: 18px;

            font-size: 10.5px;

            color:
                var(--text-dim);

            text-align: center;

            letter-spacing: 0.5px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .body {
                padding:
                    22px 18px 20px;
            }

            .key-row {
                flex-direction: column;
            }

            .key-row button {
                height: 40px;
            }

        }

        /* =========================
           TYPE TOGGLE
        ========================= */

        .type-toggle {
            position: relative;

            display: flex;

            gap: 0;

            margin-bottom: 20px;

            background: var(--panel-2);

            border: 1px solid var(--line);

            border-radius: 10px;

            padding: 4px;

            isolation: isolate;
        }


        .type-toggle-indicator {
            position: absolute;

            top: 4px;
            left: 4px;

            width: calc(50% - 4px);
            height: calc(100% - 8px);

            border-radius: 7px;

            background:
                linear-gradient(
                    135deg,
                    var(--purple-2),
                    var(--purple)
                );

            box-shadow:
                0 0 12px var(--purple-glow);

            transition:
                transform 0.35s cubic-bezier(0.65, 0, 0.35, 1);

            will-change: transform;

            z-index: 0;
        }


        .type-toggle.pos-lpthub .type-toggle-indicator {
            transform: translateX(100%);
        }


        .type-btn {
            position: relative;

            z-index: 1;

            flex: 1;

            padding: 9px 6px;

            border: none;

            border-radius: 7px;

            background: transparent;

            color: var(--text-dim);

            font-family: var(--mono);

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition:
                color 0.25s ease;
        }


        .type-btn.active {
            color: #fff;
        }


        .type-btn:not(.active):hover {
            color: var(--text);
        }

    </style>

</head>


<body>


<div id="bg-image"></div>

<canvas id="bg-canvas"></canvas>


<div class="console">

    <!-- BODY -->
    <div class="body">


        <!-- TYPE TOGGLE -->

        <div
            class="type-toggle"
            id="typeToggle">

            <div
                class="type-toggle-indicator"
                id="typeToggleIndicator">
            </div>

            <button
                class="type-btn active"
                id="typeBtnMinecraft"
                data-type="minecraft">
                MINECRAFT
            </button>

            <button
                class="type-btn"
                id="typeBtnLpthub"
                data-type="lpthub">
                LPT HUB
            </button>

        </div>


        <!-- HEADER -->

        <div class="hdr">

            <div
                class="pulse"
                id="pulse">
            </div>


            <h1 id="titleText">
                Server Minecraft
                <span>Key</span>
            </h1>


            <div class="stamp">
                VERIFY
            </div>


            <div
                class="status-inline"
                id="statusText">

                Đang xác minh...

            </div>

        </div>


        <!-- PROGRESS -->

        <div class="progress-wrap">

            <div class="progress-track">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>


            <div class="progress-labels">

                <span>
                    0s
                </span>

                <span id="countdownLabel">
                    10s
                </span>

            </div>

        </div>


        <!-- BUTTON -->

        <button
            class="main-btn"
            id="mainBtn"
            disabled>

            ĐANG CHỜ...

        </button>


        <!-- KEY -->

        <div
            class="key-out"
            id="keyOut">

            <div class="k-label">
                KEY
            </div>


            <div class="key-row">

                <input
                    type="text"
                    id="keyValue"
                    readonly>


                <button
                    id="copyBtn">

                    COPY

                </button>

            </div>

        </div>

        <!-- FOOTER -->

        <div class="footnote">

            Vui Lòng Không Rời Khỏi Trang

        </div>

    </div>

</div>



<script>

    /* =========================
       ELEMENTS
    ========================= */

    const mainBtn =
        document.getElementById("mainBtn");

    const keyOut =
        document.getElementById("keyOut");

    const keyValue =
        document.getElementById("keyValue");

    const copyBtn =
        document.getElementById("copyBtn");

    const progressFill =
        document.getElementById("progressFill");

    const countdownLabel =
        document.getElementById("countdownLabel");

    const statusText =
        document.getElementById("statusText");

    const pulse =
        document.getElementById("pulse");

    const titleText =
        document.getElementById("titleText");

    const typeToggle =
        document.getElementById("typeToggle");

    const typeBtnMinecraft =
        document.getElementById("typeBtnMinecraft");

    const typeBtnLpthub =
        document.getElementById("typeBtnLpthub");

    /* =========================
       LOẠI KEY ĐANG CHỌN
    ========================= */

    const TYPE_LABELS = {
        minecraft: "Server Minecraft",
        lpthub: "Script LPTHUB"
    };

    let currentType = "minecraft";

    /* =========================
       CHỐNG F5 / TAB ẨN DANH
       Khóa theo THỜI GIAN THỰC: 2 tiếng 50 phút
       (không còn đếm 10s chờ, bấm nút là gửi luôn)
    ========================= */

    const COOLDOWN_MS =
        (3 * 60 * 60) * 1000; // 3h

    function getStorageKey() {
        return "issued_key_" + currentType;
    }

    function getStorageTimeKey() {
        return "issued_key_time_" + currentType;
    }

    let cooldownTimer = null;

    function formatTime(ms) {

        const totalSec =
            Math.max(Math.ceil(ms / 1000), 0);

        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;

        return (
            String(h).padStart(2, "0") + ":" +
            String(m).padStart(2, "0") + ":" +
            String(s).padStart(2, "0")
        );
    }

    // Khoá nút lại, đếm ngược tới khi được lấy KEY tiếp theo
    function lockButton() {

        mainBtn.disabled = true;
        mainBtn.classList.remove("ready");
        mainBtn.textContent = "ĐÃ NHẬN KEY";

        pulse.classList.remove("ready");

        if (cooldownTimer) {
            clearInterval(cooldownTimer);
        }

        const tick = () => {

            const savedTime =
                Number(localStorage.getItem(getStorageTimeKey()) || 0);

            const remaining =
                (savedTime + COOLDOWN_MS) - Date.now();

            if (remaining <= 0) {
                clearInterval(cooldownTimer);
                unlockButton();
                return;
            }

            const progress =
                ((COOLDOWN_MS - remaining) / COOLDOWN_MS) * 100;

            progressFill.style.width =
                Math.min(Math.max(progress, 0), 100) + "%";

            countdownLabel.textContent =
                formatTime(remaining);

            statusText.textContent =
                "Chờ " + formatTime(remaining) + " để lấy KEY mới";
        };

        tick();

        cooldownTimer = setInterval(tick, 1000);
    }

    // Mở khoá nút, sẵn sàng cho bấm gửi lấy KEY ngay lập tức
    function unlockButton() {

        if (cooldownTimer) {
            clearInterval(cooldownTimer);
        }

        localStorage.removeItem(getStorageKey());
        localStorage.removeItem(getStorageTimeKey());

        keyOut.classList.remove("show");
        keyValue.value = "";

        progressFill.style.width = "0%";
        countdownLabel.textContent = "00:00:00";

        mainBtn.disabled = false;
        mainBtn.classList.add("ready");
        mainBtn.textContent = "NHẬN KEY";

        statusText.textContent = "Sẵn sàng nhận KEY";

        pulse.classList.add("ready");
    }

    // Kiểm tra trạng thái ngay khi tải trang / khi đổi loại key
    // (chống F5 và tab ẩn danh dựa theo mốc thời gian đã lưu)
    function refreshState() {

        const savedKey = localStorage.getItem(getStorageKey());

        const savedTime =
            Number(localStorage.getItem(getStorageTimeKey()) || 0);

        const elapsed = Date.now() - savedTime;

        if (savedKey && savedTime && elapsed < COOLDOWN_MS) {

            keyValue.value = savedKey;
            keyOut.classList.add("show");

            lockButton();

        } else {

            unlockButton();
        }
    }

    refreshState();

    // Đổi loại key (MINECRAFT <-> LPTHUB) với animation trượt
    function switchType(type) {

        if (type === currentType) {
            return;
        }

        currentType = type;

        typeBtnMinecraft.classList.toggle(
            "active",
            type === "minecraft"
        );

        typeBtnLpthub.classList.toggle(
            "active",
            type === "lpthub"
        );

        typeToggle.classList.toggle(
            "pos-lpthub",
            type === "lpthub"
        );

        titleText.innerHTML =
            (TYPE_LABELS[type] || "Key") +
            ' <span>Key</span>';

        refreshState();
    }

    typeBtnMinecraft.addEventListener(
        "click",
        () => switchType("minecraft")
    );

    typeBtnLpthub.addEventListener(
        "click",
        () => switchType("lpthub")
    );

    /* =========================
       GET KEY FROM SERVER
       SERVER SẼ ĐỌC keys.json
    ========================= */

    mainBtn.addEventListener(
        "click",
        async () => {

            mainBtn.disabled =
                true;


            mainBtn.classList.remove(
                "ready"
            );


            mainBtn.textContent =
                "ĐANG LẤY KEY...";
            statusText.textContent =
                "Đang lấy KEY...";

            try {

                const response =
                    await fetch(
                        "/api/get-key?type=" +
                            encodeURIComponent(currentType),
                        {
                            method: "GET",
                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );

                }

                const data =
                    await response.json();

                /* =========================
                   HẾT KEY
                ========================= */

                if (
                    !data.success ||
                    !data.key
                ) {

                    mainBtn.textContent =
                        "HẾT KEY";


                    statusText.textContent =
                        "Không còn KEY";


                    return;
                }
                
                /* =========================
                   HIỂN THỊ KEY
                ========================= */

                keyValue.value =
                    data.key;


                localStorage.setItem(
                    getStorageKey(),
                    data.key
                );

                localStorage.setItem(
                    getStorageTimeKey(),
                    String(Date.now())
                );


                keyOut.classList.add(
                    "show"
                );


                lockButton();

            }


            catch (error) {

                console.error(
                    "Get key error:",
                    error
                );


                mainBtn.disabled =
                    false;


                mainBtn.classList.add(
                    "ready"
                );


                mainBtn.textContent =
                    "THỬ LẠI";


                statusText.textContent =
                    "Lỗi kết nối server";

            }

        }
    );

    copyBtn.addEventListener(
        "click",
        async () => {

            if (!keyValue.value) {
                return;
            }

            try {

                await navigator
                    .clipboard
                    .writeText(
                        keyValue.value
                    );


                copyBtn.textContent =
                    "ĐÃ COPY";

            }

            catch (error) {

                keyValue.select();

                document.execCommand(
                    "copy"
                );


                copyBtn.textContent =
                    "ĐÃ COPY";

            }


            setTimeout(() => {

                copyBtn.textContent =
                    "COPY";

            }, 1500);

        }
    );

    const canvas =
        document.getElementById(
            "bg-canvas"
        );


    const ctx =
        canvas.getContext("2d");


    let stars = [];


    function resizeCanvas() {

        canvas.width =
            window.innerWidth;

        canvas.height =
            window.innerHeight;

        createStars();

    }


    function createStars() {

        stars = [];


        const amount =
            Math.min(
                120,
                Math.floor(
                    window.innerWidth *
                    window.innerHeight /
                    10000
                )
            );


        for (
            let i = 0;
            i < amount;
            i++
        ) {

            stars.push({

                x:
                    Math.random() *
                    canvas.width,

                y:
                    Math.random() *
                    canvas.height,

                size:
                    Math.random() *
                    1.5,

                speed:
                    Math.random() *
                    0.15 +
                    0.03,

                opacity:
                    Math.random() *
                    0.5 +
                    0.2

            });

        }

    }


    function drawStars() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        for (const star of stars) {

            star.y += star.speed;


            if (
                star.y >
                canvas.height
            ) {

                star.y = 0;

                star.x =
                    Math.random() *
                    canvas.width;

            }


            ctx.beginPath();


            ctx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${star.opacity}
                )`;


            ctx.fill();

        }


        requestAnimationFrame(
            drawStars
        );

    }


    window.addEventListener(
        "resize",
        resizeCanvas
    );


    resizeCanvas();

    drawStars();

</script>


</body>

</html>
